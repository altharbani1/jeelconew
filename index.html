  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
    }

    /* Utilities */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* --- PROFESSIONAL PRINT ENGINE CSS v4.0 --- */
    @media print {

      @page {
        size: A4 portrait;
        margin: 0mm;
      }

      /* 1. Hide entire page first */
      html, body, #root {
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        overflow: visible !important;
        height: auto !important;
        width: 100% !important;
      }

      body * {
        visibility: hidden !important;
        overflow: visible !important;
      }
      
      body #root .no-print,
      body #root .print\:hidden,
      body #root [class*="no-print"] {
        display: none !important;
        position: absolute !important;
        width: 0 !important;
        height: 0 !important;
      }

      /* Reset all flex/grid containers to normal flow */
      body > #root,
      body > #root > *,
      body > #root > * > *,
      body > #root > * > * > * {
        all: unset !important;
        display: block !important;
        overflow: visible !important;
        height: auto !important;
        width: 100% !important;
        visibility: hidden !important;
      }

      /* 2. WARRANTY CERTIFICATE: Show ONLY the certificate element, positioned fixed to fill page exactly */
      .warranty-certificate-page {
        visibility: visible !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        overflow: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
      }

      .warranty-certificate-page * {
        visibility: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* 3. MAINTENANCE CONTRACT: Show only .contract-print-page */
      .contract-print-page {
        visibility: visible !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        overflow: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .contract-print-page * {
        visibility: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* 4. General a4-page support for other modules - MULTI-PAGE FIX */
      #printable-area {
        visibility: visible !important;
        position: static !important;
        width: 210mm !important;
        margin: 0 auto !important;
        padding: 0 !important;
        background: white !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      #printable-area * {
        visibility: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .a4-page {
        visibility: visible !important;
        position: relative !important;
        width: 210mm !important;
        height: 296.5mm !important;
        overflow: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        page-break-after: always !important;
        break-after: page !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        display: flex !important;
        flex-direction: column !important;
      }

      .a4-page:last-of-type {
        page-break-after: avoid !important;
        break-after: avoid !important;
      }

      .a4-page * {
        visibility: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* 6. Tables */
      table { border-collapse: collapse !important; }
      tr { break-inside: avoid !important; }
      a { text-decoration: none !important; color: inherit !important; }
    }



    /* Custom scrollbar for better professional look on screen */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #0c4a6e;
      border-radius: 10px;
    }
  </style>
