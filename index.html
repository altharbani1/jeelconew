  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
    }

    /* Utilities */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* --- PROFESSIONAL PRINT ENGINE CSS v3.0 --- */
    @media print {

      /* 1. Global Reset */
      *,
      *::before,
      *::after {
        box-shadow: none !important;
        text-shadow: none !important;
      }

      /* 2. Body & HTML - allow full expansion */
      body,
      html {
        background-color: #ffffff !important;
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        visibility: visible !important;
      }

      /* 3. Page Geometry */
      @page {
        size: A4;
        margin: 10mm;
      }

      /* 4. Hide Navigation & UI Controls */
      nav,
      aside,
      .no-print,
      .sidebar-container,
      header.dashboard-header,
      input[type="file"],
      .hidden-print {
        display: none !important;
      }

      /* Hide ALL buttons EXCEPT those inside the printable certificate area */
      body > * button,
      #root > * button {
        display: none !important;
      }

      /* 5. Fix App Layout for print - remove height/overflow constraints */
      #root,
      #root > div,
      #root > div > main {
        display: block !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        width: 100% !important;
        position: static !important;
      }

      /* 6. Legacy #printable-area support */
      #printable-area {
        visibility: visible !important;
        position: static !important;
        width: 100% !important;
        background-color: white;
      }

      #printable-area * {
        visibility: visible !important;
      }

      /* 7. The A4 Page Container */
      .a4-page {
        width: 210mm !important;
        min-height: 296mm !important;
        position: relative !important;
        background: white !important;
        margin: 0 auto !important;
        page-break-after: always !important;
        break-after: page !important;
        overflow: hidden !important;
      }

      .a4-page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
        margin-bottom: 0 !important;
      }

      /* 8. Color Accuracy */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* 9. Typography & Layout Fixes */
      h1, h2, h3, h4, h5, h6 {
        break-after: avoid;
        page-break-after: avoid;
      }

      /* 10. Table Optimizations */
      table {
        width: 100% !important;
        border-collapse: collapse !important;
      }

      tr {
        break-inside: avoid !important;
      }

      /* 11. Link Cleanup */
      a {
        text-decoration: none !important;
        color: inherit !important;
      }
    }

    /* Custom scrollbar for better professional look on screen */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #0c4a6e;
      border-radius: 10px;
    }
  </style>
